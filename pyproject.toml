[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "321code-lang"
version = "0.5.1"
description = "321code programming language and 321 AI model creator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "321code contributors" }]
dependencies = ["Pillow>=10"]

[project.scripts]
321 = "code321.cli:main"

[project.optional-dependencies]
image-training = ["torch>=2.2", "numpy>=1.26", "Pillow>=10"]

[tool.setuptools]
packages = ["code321", "ai"]

[tool.setuptools.package-data]
code321 = ["commands.json"]
