name: 321code tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Compile all Python modules
        run: python -m compileall -q code321
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run example
        run: 321 run examples/hello.321
      - name: Check AI command help
        run: 321 ai help
