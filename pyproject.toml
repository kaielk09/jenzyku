[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "321code-lang"
version = "0.5.0"
description = "321code programming language and 321 AI model creator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "321code contributors" }]
dependencies = []

[project.scripts]
321 = "code321.cli:main"

[tool.setuptools]
packages = ["code321"]

[tool.setuptools.package-data]
code321 = ["commands.json"]
